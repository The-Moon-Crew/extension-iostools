name: Build and Validate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Haxe via Homebrew
        run: |
          brew update
          brew install haxe

      - name: Setup Haxelib and Dependencies
        run: |
          haxelib setup ~/haxelib
          haxelib install lime --quiet
          haxelib install openfl --quiet

      - name: Validate Haxe Syntax
        run: |
          haxelib dev extension-iostools .
          haxe --no-output -cp src --macro "include('extension')"
